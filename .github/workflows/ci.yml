name: CI

on:
  push:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test kafka-clients
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Build kafka-clients
        run: ./gradlew :clients:build -x test --no-daemon

      - name: Test kafka-clients
        run: ./gradlew :clients:test -PmaxParallelForks=4 --no-daemon

      - name: Upload kafka-clients JARs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kafka-clients-jars
          path: clients/build/libs/*.jar
